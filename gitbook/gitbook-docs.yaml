$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Mimic API Docs
  structure:
    - type: section
      key: section-1
      title: API Reference
      path: mimic-api-docs
      description: Every endpoint, generated from the OpenAPI spec.
      icon: code
      default: true
      children:
        - type: space
          key: space-1
          title: API Reference
          path: api-reference
          default: true
          content:
            directory: ./api-reference
    - type: section
      key: section-2
      title: Guides
      path: guides
      description: Concepts, getting started, and per-action integration walkthroughs.
      icon: book-open
      children:
        - type: space
          key: space-2
          title: Guides
          path: guides
          default: true
          content:
            directory: ./guides
