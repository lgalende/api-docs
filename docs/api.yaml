  /lending-rebalancing/prepare:
    post:
      tags:
        - Earn
      description: >-
        Computes EIP-712 data to be signed to move a deposit to the
        highest-yielding of the selected lending protocols, either once or as
        a recurring strategy that keeps monitoring APY. Submit the
        resulting signature via `POST /lending-rebalancing`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - token
                - protocols
                - rotationThresholdBps
                - wallet
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain where the rebalancing will take place
                token:
                  type: string
                  description: Underlying token to lend
                  enum:
                    - USDC
                    - USDT
                protocols:
                  type: array
                  description: >-
                    Lending protocols to consider when rotating. The
                    highest-yielding pool for `token` on `chain` is resolved
                    for each selected protocol.
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - aave
                      - compound
                      - morpho
                      - spark
                    example: aave
                rotationThresholdBps:
                  type: integer
                  description: >-
                    Minimum APY improvement required before
                    rotating to a different pool, in basis points (e.g. 50 = 0.50%)
                  minimum: 0
                  example: 50
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address whose deposit is rebalanced — holds the funds and
                    receives the output. EOAs are not supported (unless
                    they use proper EIP-7702 delegation).
                startingPercentageBps:
                  type: integer
                  description: >-
                    Percentage of the token balance to deposit on the first
                    run, in basis points (e.g. 10000 = 100%). Defaults to 10000.
                  minimum: 0
                  maximum: 10000
                  example: 10000
                frequency:
                  type: string
                  description: >-
                    How often APY is checked and the position is rebalanced
                    (if needed). Omit to rebalance once, immediately.
                  enum:
                    - hourly
                    - daily
                    - weekly
                    - monthly
                  example: daily
                endDate:
                  allOf:
                    - $ref: '#/components/schemas/Timestamp'
                  description: >-
                    Timestamp after which the strategy stops executing. Only
                    relevant when `frequency` is set. Use 0 for no end date.
                    Defaults to 0.
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: >-
            EIP-712 data to be signed to create the lending rebalancing
            strategy
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                properties:
                  signaturePayload:
                    $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
