      description: >-
        Submit the signature of the data obtained from
        `POST /stakings/unstake/prepare`, along with any required approvals, to
        unstake ETH from a staking protocol. Track the execution via `GET /stakings/{id}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /stakings/unstake/prepare:
    post:
      tags:
        - Earn
      description: >-
        Computes EIP-712 data to be signed to unstake ETH from a staking protocol. Submit the resulting
        signature, along with a signature for each entry in
        `requiredApprovals` if any are returned, via `POST /stakings/unstake`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - token
                - protocol
                - wallet
                - maxFeeUsd
              oneOf:
                - title: By token amount
                  required:
                    - amount
                - title: By fraction of the position
                  required:
                    - balanceBps
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain where the position exists
                token:
                  type: string
                  description: >-
                    Underlying token to receive. Choose WETH to receive
                    wrapped ETH.
                  enum:
                    - ETH
                    - WETH
                protocol:
                  type: string
                  description: Staking protocol to unstake from
                  enum:
                    - lido
                    - rocketpool
                    - coinbase
                amount:
                  type: string
                  description: >-
                    Amount of token to unstake, as a decimal string. Exactly
                    one of `amount` or `balanceBps` is required. To unstake
                    the whole balance, prefer `balanceBps` to avoid leaving
                    dust behind.
                  example: '10.5'
                balanceBps:
                  type: integer
                  description: >-
                    Fraction of the position to unstake, in basis points
                    (e.g. 10000 = 100% (full exit), 5000 = 50%). Exactly one
                    of `amount` or `balanceBps` is required.
                  minimum: 0
                  maximum: 10000
                  example: 10000
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address holding the position
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that receives the withdrawn token. Defaults to
                    `wallet`.
                maxFeeUsd:
                  $ref: '#/components/schemas/MaxFeeUsd'
      responses:
        '200':
          description: EIP-712 data to be signed to unstake ETH from a staking protocol
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                  - requiredApprovals
                properties:
                  signaturePayload:
                    allOf:
                      - $ref: '#/components/schemas/TriggerSignaturePayload'
                    description: EIP-712 data to be signed to unstake ETH from a staking protocol
                  requiredApprovals:
                    type: array
                    description: >-
                      Raw `approve()` transactions that must be signed and
                      submitted alongside the action signature. Empty when
                      no approvals are required.
                    items:
                      $ref: '#/components/schemas/TransactionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /stakings/{id}:
    get:
      tags:
        - Earn
      description: >-
        Get the status of a stake or unstake execution
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: >-
            ID returned by `POST /stakings/stake` or
            `POST /stakings/unstake`
      responses:
        '200':
          description: Status of the stake or unstake execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /deposit-splitting:
    post:
      tags:
        - Assets management
      description: >-
        Submit the signature of the data obtained from
        `POST /deposit-splitting/prepare` to create the deposit splitting
        strategy: a Safe wallet that accumulates incoming deposits of a
        given token and periodically splits the balance across one or
        more recipients. Track the execution via
        `GET /deposit-splitting/{id}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmission'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /deposit-splitting/prepare:
    post:
      tags:
        - Assets management
      description: >-
        Computes EIP-712 data to be signed to create a deposit splitting
        strategy: a Safe wallet that accumulates incoming deposits of a
        given token and periodically splits the balance across one or more
        recipients. Submit the resulting signature via
        `POST /deposit-splitting`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - owner
                - token
                - allocations
                - schedule
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain where the Safe wallet will be created
                owner:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that owns the Safe wallet and can update or
                    cancel its redirection rule
                token:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Token to redirect on deposit. Use
                    `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native
                    token. Deposits of any other token are not redirected.
                allocations:
                  type: array
                  description: >-
                    How the accumulated balance of token is split across
                    recipients on each execution. `bps` values must sum to
                    10000 (100%).
                  minItems: 1
                  items:
                    type: object
                    required:
                      - recipient
                      - bps
                    properties:
                      recipient:
                        allOf:
                          - $ref: '#/components/schemas/Address'
                        description: Address to redirect a share of the balance to
                      bps:
                        type: integer
                        description: Share of the balance routed to this recipient, in basis points (e.g. 5000 = 50%)
                        minimum: 0
                        maximum: 10000
                        example: 5000
                schedule:
                  allOf:
                    - $ref: '#/components/schemas/CronExpression'
                  description: How often the accumulated balance is split across recipients
                endDate:
                  allOf:
                    - $ref: '#/components/schemas/Timestamp'
                  description: >-
                    Timestamp after which the strategy stops executing. Omit
                    for no end date.
                expectedAddress:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Use this field to create a Safe wallet with the same
                    address as one previously deployed on another chain. If
                    the wallet already exists for the specified `owner` and
                    `chain`, wallet creation is skipped.
                externalId:
                  allOf:
                    - $ref: '#/components/schemas/ExternalId'
                  description: >-
                    Use this field to reference the created Safe wallet by an
                    ID from your own system, such as your user's ID. Not
                    required to be unique. When used alongside
                    `expectedAddress`, the request is rejected if the
                    existing wallet already has a different `externalId`.
      responses:
        '200':
          description: EIP-712 data to be signed to create the deposit splitting strategy
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                properties:
                  signaturePayload:
                    $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /deposit-splitting/{id}:
    get:
      tags:
        - Assets management
      description: >-
        Get the status of the deposit splitting strategy
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /deposit-splitting`
      responses:
        '200':
          description: Status of the deposit splitting strategy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StrategyStatus'
                  - type: object
                    properties:
                      depositAddress:
                        allOf:
                          - $ref: '#/components/schemas/Address'
                        description: Address of the created Safe wallet
                      externalId:
                        $ref: '#/components/schemas/ExternalId'
                      executions:
                        type: array
                        description: Most recent executions, ordered by timestamp descending
                        items:
                          description: Status of a single execution of the strategy
                          allOf:
                            - $ref: '#/components/schemas/ExecutionStatus'
                            - type: object
                              properties:
                                transfers:
                                  type: array
                                  description: Amounts sent to each recipient during this execution
                                  items:
                                    type: object
                                    required:
                                      - recipient
                                      - amount
                                    properties:
                                      recipient:
                                        allOf:
                                          - $ref: '#/components/schemas/Address'
                                      amount:
                                        type: string
                                        description: Amount sent to recipient, as a decimal string
                                        example: '10.3'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /deposit-splitting/{id}/stop/execute:
    post:
      tags:
        - Assets management
      description: >-
        Submit the signature of the data obtained from `POST /deposit-
        splitting/{id}/stop/prepare` to stop the deposit splitting strategy.
        Once stopped, `GET /deposit-splitting/{id}` reports `status` as
        `stopped`.
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /deposit-splitting`
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/DeactivationSubmission'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /deposit-splitting/{id}/stop/prepare:
    post:
      tags:
        - Assets management
      description: >-
        Computes EIP-712 data to be signed to stop the deposit splitting
        strategy. Submit the resulting signature via `POST /deposit-
        splitting/{id}/stop/execute`.
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /deposit-splitting`
      responses:
        '200':
          $ref: '#/components/responses/DeactivationPrepared'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dca:
    get:
      tags:
        - Swap
      description: >-
        List the DCA strategies created under the caller's account,
        optionally filtered by wallet. Read a single strategy via
        `GET /dca/{id}` to get portfolio information.
      parameters:
        - name: wallet
          in: query
          required: false
          description: Only return strategies for this wallet.
          schema:
            $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: List of DCA strategies
          content:
            application/json:
              schema:
                type: object
                required:
                  - strategies
                properties:
                  strategies:
                    type: array
                    description: >-
                      Matching DCA strategies. Empty when the account has
                      none, or none match `wallet`.
                    items:
                      $ref: '#/components/schemas/DcaStrategy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dca/prepare:
    post:
      tags:
        - Swap
      description: >-
        Computes EIP-712 data to be signed to create a recurring DCA
        (dollar-cost averaging) strategy. Submit the resulting signature,
        along with a signature for each entry in `requiredApprovals` if any
        are returned, via `POST /dca/{id}/execute`, using the returned `id`.
        This response expires at `signBefore`. Past that, call `/dca/prepare` again for
        a fresh payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DcaInputs'
      responses:
        '200':
          description: EIP-712 data to be signed to create the DCA strategy
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - signBefore
                  - signaturePayload
                  - executionCost
                  - requiredApprovals
                  - policies
                properties:
                  id:
                    allOf:
                      - $ref: '#/components/schemas/UUID'
                    description: >-
                      ID for this strategy. Submit the signature via
                      `POST /dca/{id}/execute` and track its status via
                      `GET /dca/{id}`.
                  signBefore:
                    allOf:
                      - $ref: '#/components/schemas/Timestamp'
                    description: >-
                      Deadline for submitting the signature via `POST /dca/{id}/execute`
                  signaturePayload:
                    $ref: '#/components/schemas/TriggerSignaturePayload'
                  executionCost:
                    type: object
                    description: Estimated cost per execution for this strategy
                    required:
                      - estimatedUsdPerExecution
                      - maxUsdPerExecution
                    properties:
                      estimatedUsdPerExecution:
                        type: string
                        description: >-
                          Estimated fee for each on-chain transaction, in
                          USD, as a decimal string
                        example: '0.42'
                      maxUsdPerExecution:
                        allOf:
                          - $ref: '#/components/schemas/MaxFeeUsd'
                        description: >-
                          The maximum fee applied per execution, derived from
                          `estimatedUsdPerExecution`. If the fee of a given
                          execution would exceed this value, that execution
                          is skipped.
                        example: '0.6'
                  requiredApprovals:
                    type: array
                    description: >-
                      Raw `approve()` transactions authorizing the settler to
                      spend `tokenIn`, which must be signed and submitted
                      alongside the action signature via
                      `POST /dca/{id}/execute`. Empty when no approvals are
                      required.
                    items:
                      $ref: '#/components/schemas/TransactionRequest'
                  policies:
                    type: array
                    description: >-
                      EIP-712 payloads authorizing the safeguards that restrict
                      what Mimic may do with this wallet. Each must be signed and
                      submitted as `signedPolicies` via `POST /dca/{id}/execute`.
                      Empty when the wallet is already safeguarded.
                    items:
                      $ref: '#/components/schemas/SafeguardSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dca/{id}:
    get:
      tags:
        - Swap
      description: Get the status of the DCA strategy
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /dca/prepare`
      responses:
        '200':
          description: Status of the DCA strategy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DcaStrategy'
                  - type: object
                    properties:
                      portfolio:
                        allOf:
                          - $ref: '#/components/schemas/PortfolioSnapshot'
                          - type: object
                            properties:
                              totalSell:
                                type: string
                                description: >-
                                  Total amount of tokenIn spent across all
                                  executions, as a decimal string
                                example: '105.0'
                              totalBuy:
                                type: string
                                description: >-
                                  Total amount of tokenOut received across
                                  all executions, as a decimal string
                                example: '0.031'
                              averagePrice:
                                type: string
                                description: >-
                                  Average USD price paid per unit of
                                  tokenOut across all executions, as a
                                  decimal string
                                example: '3387.10'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dca/{id}/execute:
    post:
      tags:
        - Swap
      description: >-
        Submit the signature of the data obtained from `POST /dca/prepare`,
        along with a signature for each `requiredApprovals` entry it
        returned, to create the recurring DCA (dollar-cost averaging)
        strategy.
        Call this before the `signBefore` deadline returned by `POST /dca/prepare`. Past it
        the payload becomes stale.
        Track the execution via `GET /dca/{id}`.
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /dca/prepare`
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '204':
          description: >-
            Signature submitted. Returned again when the same signature is
            resubmitted for this `id`, so a retry is always safe.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: >-
            Conflict — a different signature was already submitted for this
            `id`, or the signing window closed before this one arrived and
            the strategy is now `stale`
  /dca/{id}/executions:
    get:
      tags:
        - Swap
      description: Get the most recent executions of the DCA strategy
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /dca/prepare`
      responses:
        '200':
          description: Most recent executions of the DCA strategy
          content:
            application/json:
              schema:
                type: object
                required:
                  - executions
                properties:
                  executions:
                    type: array
                    description: Most recent executions, ordered by timestamp descending
                    items:
                      $ref: '#/components/schemas/StrategyExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dca/{id}/stop/execute:
    post:
      tags:
        - Swap
      description: >-
        Submit the signature of the data obtained from `POST
        /dca/{id}/stop/prepare` to stop the DCA strategy, optionally along
        with a signature for each `revocations` entry it returned. Once
        stopped, `GET /dca/{id}` reports `status` as `stopped`.
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /dca/prepare`
      requestBody:
        $ref: '#/components/requestBodies/DeactivationSubmission'
      responses:
        '200':
          $ref: '#/components/responses/DeactivationSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: >-
            Conflict — the strategy has not been executed yet, so there is
            nothing to stop
  /dca/{id}/stop/prepare:
    post:
      tags:
        - Swap
      description: >-
        Computes EIP-712 data to be signed to stop the DCA strategy, along
        with the transactions that remove the settler's allowance. Submit the
        resulting signature via `POST /dca/{id}/stop/execute`.
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /dca/prepare`
      responses:
        '200':
          $ref: '#/components/responses/DeactivationPrepared'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: >-
            Conflict — the strategy has not been executed yet, so there is
            nothing to stop
  /stop-loss:
    post:
      tags:
        - Swap
      description: >-
        Submit the signature of the data obtained from
        `POST /stop-loss/prepare` to create the stop-loss strategy that
        monitors a token's exchange rate and swaps it once it falls to or
        below a threshold. Track the execution via
        `GET /stop-loss/{id}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmission'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /stop-loss/prepare:
    post:
      tags:
        - Swap
      description: >-
        Computes EIP-712 data to be signed to create a stop-loss strategy
        that monitors a token's exchange rate and swaps it once it falls
        to or below a threshold. Submit the resulting signature via
        `POST /stop-loss`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - tokenIn
                - tokenOut
                - stopLossRate
                - wallet
                - balanceBps
                - slippageBps
                - maxFeeUsd
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain where the position exists
                tokenIn:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token being monitored and sold when the threshold is hit. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                tokenOut:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to receive after the swap. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                stopLossRate:
                  type: string
                  description: >-
                    Amount of tokenOut received per unit of tokenIn, at or
                    below which to trigger the swap.
                  example: '0.00041'
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address whose balance is monitored and from where the
                    funds will be pulled. EOAs are not supported (unless
                    they use proper EIP-7702 delegation).
                balanceBps:
                  type: integer
                  description: >-
                    Fraction of the tokenIn balance to swap, in basis points
                    (e.g. 10000 = 100% (full balance), 3330 = 33.3%)
                  minimum: 0
                  maximum: 10000
                  example: 10000
                slippageBps:
                  $ref: '#/components/schemas/SlippageBps'
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that receives the tokenOut. Defaults to `wallet`.
                maxFeeUsd:
                  $ref: '#/components/schemas/MaxFeeUsd'
      responses:
        '200':
          description: EIP-712 data to be signed to create the stop-loss strategy
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                properties:
                  signaturePayload:
                    $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /stop-loss/{id}:
    get:
      tags:
        - Swap
      description: Get the status of the stop-loss strategy
      parameters:
        - $ref: '#/components/parameters/ActionId'
          description: ID returned by `POST /stop-loss`
      responses:
        '200':
          description: Status of the stop-loss strategy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StrategyStatus'
                  - type: object
                    properties:
                      portfolio:
                        allOf:
                          - $ref: '#/components/schemas/PortfolioSnapshot'
                          - type: object
                            properties:
                              currentRate:
                                type: string
                                description: Current amount of tokenOut received per unit of tokenIn
                                example: '0.00039'
                              stopLossRate:
                                type: string
                                description: Amount of tokenOut received per unit of tokenIn at or below which the swap triggers
                                example: '0.00041'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /stop-loss/{id}/stop/execute:
    post:
      tags:
        - Swap
      description: >-
        Submit the signature of the data obtained from `POST /stop-
        loss/{id}/stop/prepare` to stop the stop-loss strategy. Once stopped,
        `GET /stop-loss/{id}` reports `status` as `stopped`.
