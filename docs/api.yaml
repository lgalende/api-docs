              properties:
                token:
                  type: string
                  description: Stablecoin to consolidate all token balances into
                  enum:
                    - USDC
                    - USDT
                    - DAI
                chainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID to use to fetch tokens and consolidate to stablecoin
                usdMinAmount:
                  type: string
                  description: >-
                    Threshold for token balances to fetch, in USD as a
                    decimal string
                  example: '0.05'
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address whose balances are consolidated. EOAs are not
                    supported (unless they use proper EIP-7702 delegation).
                slippageBps:
                  type: integer
                  description: Maximum slippage in token out amount to accept, in BPS (10000 = 100%)
                  minimum: 0
                  maximum: 10000
                  example: 50
                frequency:
                  type: string
                  description: >-
                    How often to sweep balances into the stablecoin. Omit to
                    run once, immediately.
                  enum:
                    - hourly
                    - daily
                    - weekly
                    - monthly
                  example: daily
                endDate:
                  allOf:
                    - $ref: '#/components/schemas/Timestamp'
                  description: >-
                    Timestamp after which the strategy stops executing. Only
                    relevant when `frequency` is set. Use 0 for no end date.
                    Defaults to 0.
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: >-
            EIP-712 data to be signed to create the consolidation to
            stablecoin strategy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
  /stablecoin-consolidation/{sig}:
    get:
      tags:
        - Assets management
      description: >-
        Get the status of the stablecoin consolidation strategy and its
        executions
      parameters:
        - name: sig
          in: path
          required: true
          description: Signature submitted to POST /stablecoin-consolidation
          schema:
            $ref: '#/components/schemas/Signature'
      responses:
        '200':
          description: >-
            Status of the stablecoin consolidation strategy and its
            executions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /balances:
    post:
      tags:
        - Oracle queries
      description: Get the token balance of an owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - token
                - owner
              properties:
                chainId:
                  $ref: '#/components/schemas/ChainId'
                token:
                  $ref: '#/components/schemas/Address'
                owner:
                  $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: Token balance
          content:
            application/json:
              schema:
                type: object
                required:
                  - amount
                properties:
                  amount:
                    $ref: '#/components/schemas/BigInteger'
        '400':
          $ref: '#/components/responses/BadRequest'
  /allowances:
    post:
      tags:
        - Oracle queries
      description: Get the token amount an owner has allowed a spender to use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - token
                - owner
                - spender
              properties:
                chainId:
                  $ref: '#/components/schemas/ChainId'
                token:
                  $ref: '#/components/schemas/Address'
                owner:
                  $ref: '#/components/schemas/Address'
                spender:
                  $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: Allowed token amount
          content:
            application/json:
              schema:
                type: object
                required:
                  - amount
                properties:
                  amount:
                    $ref: '#/components/schemas/BigInteger'
        '400':
          $ref: '#/components/responses/BadRequest'
  /prices:
    post:
      tags:
        - Oracle queries
      description: Get the USD price of a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - token
              properties:
                chainId:
                  $ref: '#/components/schemas/ChainId'
                token:
                  $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: Token price in USD
          content:
            application/json:
              schema:
                type: object
                required:
                  - price
                properties:
                  price:
                    type: string
                    description: USD price per token, as a decimal string
                    example: '3245.12'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  requestBodies:
    SignatureSubmission:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - signature
            properties:
              signature:
                $ref: '#/components/schemas/TriggerSignature'
    SignatureSubmissionWithApprovals:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - signature
            properties:
              signature:
                $ref: '#/components/schemas/TriggerSignature'
              approvals:
                type: array
                description: >-
                  Signed raw `approve()` transactions authorizing the
                  token spend needed for this action, one per entry in the
                  corresponding `/data` response's `requiredApprovals`.
                  Omit or leave empty when `requiredApprovals` was empty.
                items:
                  $ref: '#/components/schemas/SignedApproval'
  responses:
    SignatureSubmitted:
      description: Signature submitted
      content:
        application/json:
          schema:
            type: object
            properties:
              sig:
                allOf:
                  - $ref: '#/components/schemas/Signature'
    BadRequest:
      description: Bad request — invalid parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized — missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden — caller is not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Address:
      type: string
      description: >-
        A valid address on the relevant chain. Format depends on the chain:
        0x-prefixed 20-byte hex for EVM chains, base58 for other chains
        (e.g. Solana, Tron).
      example: '0x1234567890abcdef1234567890abcdef12345678'
    HexString:
      type: string
      description: An arbitrary 0x-prefixed hex string.
      example: '0xdeadbeef'
    Signature:
      type: string
      description: A 65-byte hex-encoded ECDSA signature (130 hex chars + 0x prefix).
      example: 0xabc...def
    BigInteger:
      type: string
      description: A non-negative integer represented as a decimal string.
      example: '1000000000000000000'
    CID:
      type: string
      description: An IPFS content identifier (CIDv0 or CIDv1 base32).
      example: QmXoypizjW3WknFiJnKLwHCnL72vedxjQkDDP1mXWo6uco
    SemVer:
      type: string
      description: A semantic version string.
      example: 1.0.0
    Timestamp:
      type: integer
      description: Unix timestamp in milliseconds.
      example: 1700000000000
    ChainId:
      type: integer
      description: A supported chain ID.
      example: 1
    ExecutionStatus:
      type: object
      description: Status of an action execution
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
        inputs:
          type: object
          description: Key-value map of the original request parameters
        timestamp:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Timestamp of the execution
        logs:
          type: array
          description: Execution log messages
          items:
            type: string
        error:
          type: string
          description: Error message. Present only when status is `failed`.
    Swap:
      type: object
      description: Single-chain or cross-chain swap that occurred during an execution
      required:
        - sourceChainId
        - destinationChainId
        - tokenIn
        - tokenOut
        - amountIn
        - amountOut
      properties:
        sourceChainId:
          allOf:
            - $ref: '#/components/schemas/ChainId'
          description: Chain ID tokenIn was swapped from
        destinationChainId:
          allOf:
            - $ref: '#/components/schemas/ChainId'
          description: >-
            Chain ID tokenOut was received on. Equal to sourceChainId for a
            same-chain swap.
        tokenIn:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Token that was spent
        tokenOut:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Token that was received
        amountIn:
          type: string
          description: Amount of tokenIn spent, as a decimal string
          example: '10.5'
        amountOut:
          type: string
          description: Amount of tokenOut received, as a decimal string
          example: '10.3'
        txHash:
          allOf:
            - $ref: '#/components/schemas/HexString'
          description: Transaction hash on sourceChainId
        destinationTxHash:
          allOf:
            - $ref: '#/components/schemas/HexString'
          description: >-
            Transaction hash on destinationChainId. Present only when
            destinationChainId differs from sourceChainId.
    PortfolioSnapshot:
      type: object
      description: Snapshot of token balances relevant to a strategy and their USD value
      required:
        - timestamp
        - totalUsdValue
        - balances
      properties:
        timestamp:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: Timestamp the snapshot was taken
        totalUsdValue:
          type: string
          description: Total USD value of balances, as a decimal string
          example: '123456.78'
        balances:
          type: array
          description: Balance of each token relevant to the strategy
          items:
            type: object
            required:
              - token
              - amount
              - usdValue
            properties:
              token:
                allOf:
                  - $ref: '#/components/schemas/Address'
                description: Token address. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
              amount:
                type: string
                description: Token balance, as a decimal string
                example: '10.5'
              usdValue:
                type: string
                description: USD value of the balance, as a decimal string
                example: '35245.67'
    StrategyStatus:
      type: object
      description: Status of a recurring assets management strategy and its most recent executions
      required:
        - status
        - executions
      properties:
        status:
          type: string
          enum:
            - active
            - stopped
            - expired
          description: Status of the underlying recurring trigger
        inputs:
          type: object
          description: Key-value map of the original request parameters
        nextExecution:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: >-
            Timestamp of the next scheduled execution. Omitted when
            `status` is not `active`.
        executions:
          type: array
          description: Most recent executions, ordered by timestamp descending
          items:
            description: Status of a single execution of a recurring strategy
            allOf:
              - $ref: '#/components/schemas/ExecutionStatus'
              - type: object
                properties:
                  swaps:
                    type: array
                    description: Single-chain or cross-chain swaps that occurred during this execution
                    items:
                      $ref: '#/components/schemas/Swap'
        portfolio:
          allOf:
            - $ref: '#/components/schemas/PortfolioSnapshot'
          description: >-
            Current balances and information relevant to this strategy
    Settler:
      type: object
      required:
        - address
        - chainId
      properties:
        address:
          $ref: '#/components/schemas/Address'
        chainId:
          $ref: '#/components/schemas/ChainId'
    TriggerDomain:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          example: Mimic Protocol - Registry
        version:
          type: string
          example: '1'
    TriggerSignaturePayload:
      type: object
      description: EIP-712 data to be signed to authorize a function execution
      required:
        - domain
        - primaryType
        - types
        - values
      properties:
        domain:
          $ref: '#/components/schemas/TriggerDomain'
        primaryType:
          type: string
          example: 'Trigger'
        types:
          $ref: '#/components/schemas/TriggerTypes'
        values:
          $ref: '#/components/schemas/TriggerTypedDataValues'
    TriggerSignature:
      type: object
      description: An EIP-712 signature over a TriggerSignaturePayload, submitted to authorize execution
      required:
        - typedData
        - sig
        - signer
      properties:
        typedData:
          type: object
          required:
            - types
            - values
          properties:
            types:
              $ref: '#/components/schemas/TriggerTypes'
            values:
              $ref: '#/components/schemas/TriggerTypedDataValues'
        sig:
          allOf:
            - $ref: '#/components/schemas/Signature'
          description: EIP-712 signature over `typedData` by `signer`
        signer:
          $ref: '#/components/schemas/Address'
    ApprovalTransaction:
      type: object
      description: >-
        Unsigned raw transaction calling `approve(spender, amount)` on the
        token contract, to authorize the token spend required by an action.
      required:
        - to
        - data
        - value
      properties:
        to:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Token contract address to call. Equal to `token`.
        data:
          allOf:
            - $ref: '#/components/schemas/HexString'
          description: ABI-encoded calldata for `approve(spender, amount)`
        value:
          type: string
          description: Native token value to send with the transaction. Always `"0"`.
          example: '0'
    ApprovalRequirement:
      type: object
      description: >-
        A raw `approve()` transaction that must be signed and submitted
        alongside the action signature before the action can execute.
      required:
        - token
        - spender
        - amount
        - transaction
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Token that needs approval
        spender:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Address to be approved to spend the token
        amount:
          allOf:
            - $ref: '#/components/schemas/BigInteger'
          description: Amount to approve
        transaction:
          allOf:
            - $ref: '#/components/schemas/ApprovalTransaction'
          description: Raw `approve()` transaction to sign
    SignedApproval:
      type: object
      description: >-
        A signed raw `approve()` transaction submitted to satisfy one
        entry of a `/data` response's `requiredApprovals`.
      required:
        - token
        - signedTransaction
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: >-
            Token this approval is for, matching the `token` of the
            corresponding `requiredApprovals` entry
        signedTransaction:
          allOf:
            - $ref: '#/components/schemas/HexString'
          description: >-
            The matching `requiredApprovals[].transaction`, signed and
            RLP-encoded (as accepted by `eth_sendRawTransaction`)
    TriggerType:
      type: integer
      enum:
        - 0
        - 1
        - 2
      description: |
        Trigger execution mode:
        - `0` — Cron: fires on a recurring cron schedule
        - `1` — Event: fires on an on-chain event
        - `2` — Once: fires exactly once at a specific time
    TriggerTypes:
      type: object
      required:
        - Input
        - Config
        - Trigger
      description: EIP-712 type definitions for the trigger's typed data
      properties:
        Input:
          type: array
          items:
            $ref: '#/components/schemas/TypedDataField'
        Config:
          type: array
          items:
            $ref: '#/components/schemas/TypedDataField'
        Trigger:
          type: array
          items:
            $ref: '#/components/schemas/TypedDataField'
    TypedDataField:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          description: Solidity type or a custom type (`Token`, `TokenAmount`)
    TriggerTypedDataValues:
      type: object
      required:
        - functionCid
        - version
        - input
        - config
        - executionFeeLimit
        - minValidations
      properties:
        functionCid:
          $ref: '#/components/schemas/CID'
        version:
          $ref: '#/components/schemas/SemVer'
        input:
          type: object
          description: Key-value map matching the function's manifest input schema
        config:
          $ref: '#/components/schemas/TriggerConfig'
        executionFeeLimit:
          allOf:
            - $ref: '#/components/schemas/BigInteger'
          description: Maximum fee (in protocol units) the signer accepts per execution
        minValidations:
          type: integer
          example: 1
          description: Minimum number of validator confirmations required
    CronTriggerConfig:
      type: object
      required:
        - type
        - schedule
        - delta
        - endDate
      properties:
        type:
          type: integer
          enum:
            - 0
        schedule:
          type: string
          description: A valid cron expression
          example: '0 * * * *'
        delta:
          type: string
          description: A time delta string
          example: '30m'
        endDate:
          $ref: '#/components/schemas/Timestamp'
    EventTriggerConfig:
      type: object
      required:
        - type
        - chainId
        - contract
        - topics
        - delta
        - endDate
      properties:
        type:
          type: integer
          enum:
            - 1
        chainId:
          $ref: '#/components/schemas/ChainId'
        contract:
          description: Contract address to filter events from, or `"any"` for any contract
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: string
              enum:
                - any
        topics:
          type: array
          description: >
            Array of 1–4 topic groups. Each group is an OR filter; groups are
            AND-combined.
          minItems: 1
          maxItems: 4
          items:
            type: array
            items:
              $ref: '#/components/schemas/HexString'
        delta:
          type: string
          description: Time delta after the event before execution fires
        endDate:
          $ref: '#/components/schemas/Timestamp'
    OnceTriggerConfig:
      type: object
      required:
        - type
        - startDate
        - delta
        - endDate
      properties:
        type:
          type: integer
          enum:
            - 2
        startDate:
          $ref: '#/components/schemas/Timestamp'
        delta:
          type: string
          description: Duration window; `endDate` must equal `startDate + delta`
        endDate:
          $ref: '#/components/schemas/Timestamp'
    TriggerConfig:
      description: >
        Trigger schedule configuration. Discriminated by the integer `type`
        field: `0` → CronTriggerConfig, `1` → EventTriggerConfig, `2` →
        OnceTriggerConfig.
      oneOf:
        - $ref: '#/components/schemas/CronTriggerConfig'
        - $ref: '#/components/schemas/EventTriggerConfig'
        - $ref: '#/components/schemas/OnceTriggerConfig'
    Error:
      type: object
      properties:
        message:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
