  /portfolio-rebalancing/prepare:
    post:
      tags:
        - Assets management
      description: >-
        Computes EIP-712 data to be signed to rebalance a portfolio to target
        token allocations, either once or as a recurring strategy. Submit
        the resulting signature via `POST /portfolio-rebalancing`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - allocations
                - wallet
                - slippageBps
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain where the portfolio exists
                allocations:
                  type: array
                  description: >-
                    Target allocation for each token. `targetBps` values must
                    sum to 10000 (100%).
                  minItems: 2
                  items:
                    type: object
                    required:
                      - token
                      - targetBps
                    properties:
                      token:
                        allOf:
                          - $ref: '#/components/schemas/Address'
                        description: Token address. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                      targetBps:
                        type: integer
                        description: Target share of the portfolio, in basis points (e.g. 50 = 0.50%)
                        minimum: 0
                        maximum: 10000
                        example: 5000
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address whose portfolio is rebalanced — holds the funds
                    and receives the output. EOAs are not supported
                    (unless they use proper EIP-7702 delegation).
                slippageBps:
                  type: integer
                  description: Slippage tolerance for the swaps, in basis points (e.g. 50 = 0.50%)
                  minimum: 0
                  maximum: 10000
                  example: 50
                driftToleranceBps:
                  type: integer
                  description: >-
                    Minimum deviation from a token's target allocation required before it is rebalanced, in
                    basis points (e.g. 10 = 0.10%)
                  minimum: 0
                  maximum: 10000
                  example: 100
                frequency:
                  type: string
                  description: >-
                    How often the portfolio is checked and rebalanced (if
                    needed). Omit to rebalance once, immediately.
                  enum:
                    - hourly
                    - daily
                    - weekly
                    - monthly
                  example: weekly
                endDate:
                  allOf:
                    - $ref: '#/components/schemas/Timestamp'
                  description: >-
                    Timestamp after which the strategy stops executing. Only
                    relevant when `frequency` is set. Use 0 for no end date.
                    Defaults to 0.
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: >-
            EIP-712 data to be signed to create the portfolio rebalancing
            strategy
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                properties:
                  signaturePayload:
                    $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
  /portfolio-rebalancing/{id}:
    get:
