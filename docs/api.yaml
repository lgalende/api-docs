      description: >-
        Computes EIP-712 data to be signed to create a stop-loss strategy
        that monitors a token's price and swaps it once it falls to or
        below a threshold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - tokenIn
                - tokenOut
                - stopLossPrice
                - wallet
                - balanceBps
                - slippageBps
              properties:
                chainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID where the position exists
                tokenIn:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token being monitored and sold when the threshold is hit. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                tokenOut:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to receive after the swap. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                stopLossPrice:
                  type: string
                  description: >-
