                slippageBps:
                  type: integer
                  description: Slippage tolerance for the swap, in basis points (e.g. 50 = 0.50%)
                  minimum: 0
                  maximum: 10000
                  example: 50
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that receives the tokenOut. Defaults to `wallet`.
                feeAmount:
                  type: string
                  description: >-
