openapi: 3.1.0
info:
  title: Mimic API
  description: |-
    This is a Mimic API specification.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.0.1-rc
externalDocs:
  description: Find out more about Mimic
  url: https://mimic.fi
tags:
  - name: General
    description: General information
  - name: Wallets management
    description: >-
      Create and manage wallets. For Safe wallets, compute EIP-712 data to
      sign via `POST /wallets/safe/data`, then submit the signature via
      `POST /wallets/safe`. For custodial EOA wallets, create directly via
      `POST /wallets/eoa`
  - name: Core actions
    description: >-
      Basic wallet operations. Compute EIP-712 data to sign via
      `POST /{action}/data`, then submit the signature via `POST /{action}`
  - name: Swap
    description: >-
      Single-chain and recurring swap-based actions. Compute EIP-712 data
      to sign via `POST /{action}/data`, then submit the signature via
      `POST /{action}`
  - name: Bridge
    description: >-
      Cross-chain token transfers. Compute EIP-712 data to sign via
      `POST /{action}/data`, then submit the signature via `POST /{action}`
  - name: Earn
    description: >-
      Lending, staking and yield strategies. Compute EIP-712 data
      to sign via `POST /{action}/data`, then submit the signature via
      `POST /{action}`
  - name: Assets management
    description: >-
      Automated strategies that manage a portfolio over time. Compute
      EIP-712 data to sign via `POST /{action}/data`, then submit the
      signature via `POST /{action}`
  - name: Oracle queries
    description: Read blockchain data
paths:
  /chains:
    get:
      tags:
        - General
      description: Get supported chains
      responses:
        '200':
          description: List of supported chains
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: 
                    chainId:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: 'Ethereum'
  /settlers:
    get:
      tags:
        - General
      description: Get supported settler addresses
      responses:
        '200':
          description: List of settler addresses for all supported chains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settler'
        '400':
          $ref: '#/components/responses/BadRequest'
  /settlers/{chainId}:
    get:
      tags:
        - General
      description: Get the settler address for a supported chain
      parameters:
        - name: chainId
          in: path
          required: true
          description: Supported chain ID from /chains
          schema:
            $ref: '#/components/schemas/ChainId'
      responses:
        '200':
          description: Settler address for the requested chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settler'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/eoa:
    post:
      tags:
        - Wallets management
      description: >-
        Create a new custodial EOA wallet, generating and storing a new
        keypair managed by Mimic
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
              properties:
                chainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: >-
                    Supported chain ID from /chains for which to create the
                    wallet
      responses:
        '200':
          description: The newly created EOA wallet
          content:
            application/json:
              schema:
                type: object
                required:
                  - chainId
                  - address
                properties:
                  chainId:
                    allOf:
                      - $ref: '#/components/schemas/ChainId'
                    description: Chain ID this wallet was created for
                  address:
                    allOf:
                      - $ref: '#/components/schemas/Address'
                    description: >-
                      Address of the created EOA wallet, in the format
                      used by the requested chainId
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Wallets management
      description: >-
        List the custodial EOA wallets created under the caller's account,
        optionally filtered by chainId and/or address
      security:
        - ApiKeyAuth: []
      parameters:
        - name: chainId
          in: query
          required: false
          description: Only return wallets created for this chain ID
          schema:
            $ref: '#/components/schemas/ChainId'
        - name: address
          in: query
          required: false
          description: >-
            Only return wallets matching this address, if they belong to
            the caller's account
          schema:
            $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: List of EOA wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - address
                    - chainId
                  properties:
                    chainId:
                      allOf:
                        - $ref: '#/components/schemas/ChainId'
                      description: Chain ID this wallet was created for
                    address:
                      allOf:
                        - $ref: '#/components/schemas/Address'
                      description: >-
                        Address of the EOA wallet, in the format used by
                        chainId
        '401':
          $ref: '#/components/responses/Unauthorized'
  /wallets/safe:
    post:
      tags:
        - Wallets management
      description: Submit the signature to create the Safe wallet
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmission'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/safe/data:
    post:
      tags:
        - Wallets management
      description: Computes EIP-712 data to be signed to create a new Safe wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - owner
              properties:
                chainId:
                  type: integer
                  description: Supported chain ID from /chains
                  minimum: 1
                  example: 1
                owner:
                  type: string
                  description: Address that will own the Safe wallet
                  example: '0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045'
                expectedAddress:
                  type: string
                  description: >-
                    Use this option to create a wallet with the same
                    address as one previously deployed on another chain. If
                    the wallet already exists for the specified `owner` and
                    `chainId`, it skips wallet creation.
                  example: '0x1234567890abcdef1234567890abcdef12345678'
      responses:
        '200':
          description: EIP-712 data to be signed to create a new Safe wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
  /wallets/safe/{sig}:
    get:
      tags:
        - Wallets management
      description: Get the status of a Safe wallet creation execution
      parameters:
        - name: sig
          in: path
          required: true
          description: Signature submitted to POST /wallets/safe
          schema:
            $ref: '#/components/schemas/Signature'
      responses:
        '200':
          description: Status of the wallet creation execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
                      walletAddress:
                        allOf:
                          - $ref: '#/components/schemas/Address'
                        description: >-
                          Address of the created wallet. Present only when
                          status is `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /transfers:
    post:
      tags:
        - Core actions
      description: Submit the signature to execute the transfer
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /transfers/data:
    post:
      tags:
        - Core actions
      description: >-
        Computes EIP-712 data to be signed to transfer tokens from a wallet
        to a recipient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - token
                - amount
                - wallet
                - recipient
              properties:
                chainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID where the transfer will be executed
                token:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to transfer. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                amount:
                  type: string
                  description: Amount of token to transfer, as a decimal string
                  example: '10.5'
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address from where the funds will be pulled
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address that receives the tokens
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: EIP-712 data to be signed to create the transfer
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                  - requiredApprovals
                properties:
                  signaturePayload:
                    allOf:
                      - $ref: '#/components/schemas/TriggerSignaturePayload'
                    description: EIP-712 data to be signed to create the transfer
                  requiredApprovals:
                    type: array
                    description: >-
                      Raw `approve()` transactions that must be signed and
                      submitted alongside the action signature. Empty when
                      the wallet has already approved a sufficient amount.
                    items:
                      $ref: '#/components/schemas/ApprovalRequirement'
        '400':
          $ref: '#/components/responses/BadRequest'
  /transfers/{sig}:
    get:
      tags:
        - Core actions
      description: Get the status of a transfer execution
      parameters:
        - name: sig
          in: path
          required: true
          description: Signature submitted to POST /transfers
          schema:
            $ref: '#/components/schemas/Signature'
      responses:
        '200':
          description: Status of the transfer execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /swaps:
    post:
      tags:
        - Swap
      description: Submit the signature to execute the swap
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /swaps/data:
    post:
      tags:
        - Swap
      description: >-
        Computes EIP-712 data to be signed to create a single-chain swap
        operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - tokenIn
                - amount
                - tokenOut
                - wallet
              properties:
                chainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID where the swap will be executed
                tokenIn:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to swap from. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                amount:
                  type: string
                  description: Amount of tokenIn to swap, as a decimal string
                  example: '0.05'
                tokenOut:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to swap to. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address from where the funds will be pulled
                slippageBps:
                  type: integer
                  description: >-
                    Maximum slippage in tokenOut amount to accept, in basis
                    points (e.g. 10000 = 100%). Exactly one of
                    `slippageBps` or `minAmountOut` is required, not both.
                  minimum: 0
                  maximum: 10000
                  example: 50
                minAmountOut:
                  type: string
                  description: >-
                    Minimum amount of tokenOut to accept, as a decimal
                    string. Exactly one of `slippageBps` or `minAmountOut`
                    is required, not both.
                  example: '0.048'
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that receives the tokenOut. Defaults to `wallet`.
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: EIP-712 data to be signed to create the swap intent
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                  - requiredApprovals
                properties:
                  signaturePayload:
                    allOf:
                      - $ref: '#/components/schemas/TriggerSignaturePayload'
                    description: EIP-712 data to be signed to create the swap intent
                  requiredApprovals:
                    type: array
                    description: >-
                      Raw `approve()` transactions that must be signed and
                      submitted alongside the action signature. Empty when
                      the wallet has already approved a sufficient amount.
                    items:
                      $ref: '#/components/schemas/ApprovalRequirement'
        '400':
          $ref: '#/components/responses/BadRequest'
  /swaps/{sig}:
    get:
      tags:
        - Swap
      description: Get the status of a swap execution
      parameters:
        - name: sig
          in: path
          required: true
          description: Signature submitted to POST /swaps
          schema:
            $ref: '#/components/schemas/Signature'
      responses:
        '200':
          description: Status of the swap execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
                      amountOut:
                        type: string
                        description: >-
                          Actual amount of tokenOut received. Present only
                          when status is `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /bridges:
    post:
      tags:
        - Bridge
      description: Submit the signature to execute the bridge
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /bridges/data:
    post:
      tags:
        - Bridge
      description: >-
        Computes EIP-712 data to be signed to move a token from one chain to
        another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceChainId
                - destinationChainId
                - token
                - amount
                - wallet
              properties:
                sourceChainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID to bridge the token from
                destinationChainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID to receive the token on
                token:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to bridge. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                amount:
                  type: string
                  description: Amount of token to bridge, as a decimal string
                  example: '0.05'
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address from where the funds will be pulled
                slippageBps:
                  type: integer
                  description: >-
                    Maximum slippage in received amount to accept, in basis
                    points (e.g. 10000 = 100%). Exactly one of
                    `slippageBps` or `minAmountOut` is required, not both.
                  minimum: 0
                  maximum: 10000
                  example: 50
                minAmountOut:
                  type: string
                  description: >-
                    Minimum amount of token to receive on destinationChainId,
                    as a decimal string. Exactly one of `slippageBps` or
                    `minAmountOut` is required, not both.
                  example: '0.048'
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that receives the token on destinationChainId. Defaults to `wallet`.
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: EIP-712 data to be signed to create the bridge intent
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                  - requiredApprovals
                properties:
                  signaturePayload:
                    allOf:
                      - $ref: '#/components/schemas/TriggerSignaturePayload'
                    description: EIP-712 data to be signed to create the bridge intent
                  requiredApprovals:
                    type: array
                    description: >-
                      Raw `approve()` transactions that must be signed and
                      submitted alongside the action signature. Empty when
                      the wallet has already approved a sufficient amount.
                    items:
                      $ref: '#/components/schemas/ApprovalRequirement'
        '400':
          $ref: '#/components/responses/BadRequest'
  /bridges/{sig}:
    get:
      tags:
        - Bridge
      description: Get the status of a bridge execution
      parameters:
        - name: sig
          in: path
          required: true
          description: Signature submitted to POST /bridges
          schema:
            $ref: '#/components/schemas/Signature'
      responses:
        '200':
          description: Status of the bridge execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash on sourceChainId. Present only
                          when status is `succeeded`.
                      destinationTxHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash on destinationChainId. Present
                          only when status is `succeeded`.
                      amountOut:
                        type: string
                        description: >-
                          Actual amount of token received on
                          destinationChainId. Present only when status is
                          `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /lendings:
    post:
      tags:
        - Earn
      description: Submit the signature to execute the deposit into a lending pool
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /lendings/data:
    post:
      tags:
        - Earn
      description: >-
        Computes EIP-712 data to be signed to deposit a token into a
        lending pool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - token
                - protocol
                - amount
                - wallet
              properties:
                chainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID where the deposit will be made
                token:
                  type: string
                  description: Underlying token to lend
                  enum:
                    - USDC
                    - USDT
                protocol:
                  type: string
                  description: Lending protocol to deposit into
                  enum:
                    - aave
                    - compound
                    - morpho
                    - spark
                amount:
                  type: string
                  description: Amount of token to deposit, as a decimal string
                  example: '10.5'
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address from where the funds will be pulled and that
                    receives the deposit position
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: EIP-712 data to be signed to create the deposit
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                  - requiredApprovals
                properties:
                  signaturePayload:
                    allOf:
                      - $ref: '#/components/schemas/TriggerSignaturePayload'
                    description: EIP-712 data to be signed to create the deposit
                  requiredApprovals:
                    type: array
                    description: >-
                      Raw `approve()` transactions that must be signed and
                      submitted alongside the action signature. Empty when
                      the wallet has already approved a sufficient amount.
                    items:
                      $ref: '#/components/schemas/ApprovalRequirement'
        '400':
          $ref: '#/components/responses/BadRequest'
  /lendings/{sig}:
    get:
      tags:
        - Earn
      description: Get the status of a lending deposit execution
      parameters:
        - name: sig
          in: path
          required: true
          description: Signature submitted to POST /lendings
          schema:
            $ref: '#/components/schemas/Signature'
      responses:
        '200':
          description: Status of the lending deposit execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /deposit-splitting:
    post:
      tags:
        - Assets management
      description: Submit the signature to create the deposit splitting strategy
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmission'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /deposit-splitting/data:
    post:
      tags:
        - Assets management
      description: >-
        Computes EIP-712 data to be signed to create a deposit splitting
        strategy: a Safe wallet that accumulates incoming deposits of a
        given token and periodically splits the balance across one or more
        recipients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - owner
                - token
                - allocations
                - frequency
              properties:
                chainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID where the Safe wallet will be created
                owner:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that owns the Safe wallet and can update or
                    cancel its redirection rule
                token:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Token to redirect on deposit. Use
                    `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native
                    token. Deposits of any other token are not redirected.
                allocations:
                  type: array
                  description: >-
                    How the accumulated balance of token is split across
                    recipients on each execution. `bps` values must sum to
                    10000 (100%).
                  minItems: 1
                  items:
                    type: object
                    required:
                      - recipient
                      - bps
                    properties:
                      recipient:
                        allOf:
                          - $ref: '#/components/schemas/Address'
                        description: Address to redirect a share of the balance to
                      bps:
                        type: integer
                        description: Share of the balance routed to this recipient, in basis points (e.g. 5000 = 50%)
                        minimum: 0
                        maximum: 10000
                        example: 5000
                frequency:
                  type: string
                  description: How often the accumulated balance is split across recipients
                  enum:
                    - hourly
                    - daily
                    - weekly
                    - monthly
