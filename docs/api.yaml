  /dca/data:
    post:
      tags:
        - Swap
      description: >-
        Computes EIP-712 data to be signed to create a recurring DCA
        (dollar-cost averaging) strategy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chainId
                - tokenIn
                - tokenOut
                - amount
                - wallet
                - frequency
              properties:
                chainId:
                  allOf:
                    - $ref: '#/components/schemas/ChainId'
                  description: Chain ID where the swap will be executed
                tokenIn:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to spend on each execution. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                tokenOut:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to accumulate. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                amount:
                  type: string
                  description: Amount of tokenIn to spend per execution, as a decimal string
                  example: '10.5'
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address from where the funds will be pulled. EOAs are
                    not supported (unless they use proper EIP-7702 delegation).
                slippageBps:
                  type: integer
                  description: >-
                    Slippage tolerance, in basis points (e.g. 50 = 0.50%).
                    Exactly one of `slippageBps` or `minAmountOut` is
                    required, not both.
                  minimum: 0
                  maximum: 10000
                  example: 50
                minAmountOut:
                  type: string
                  description: >-
                    Minimum amount of tokenOut to accept per execution, as a
                    decimal string. Exactly one of `slippageBps` or
                    `minAmountOut` is required, not both.
                  example: '10.3'
                frequency:
                  type: string
                  description: How often the DCA swap executes
                  enum:
                    - hourly
                    - daily
                    - weekly
                    - monthly
                  example: daily
                endDate:
                  allOf:
                    - $ref: '#/components/schemas/Timestamp'
                  description: Timestamp after which the strategy stops executing. Use 0 for no end date. Defaults to 0.
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that receives the tokenOut. Defaults to `wallet`.
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: EIP-712 data to be signed to create the DCA strategy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
