openapi: 3.1.0
info:
  title: Mimic API
  description: |-
    Mimic API lets you execute on-chain wallet actions via signed
    intents, including transfers, swaps, bridges, lending, staking, and
    automated portfolio strategies such as DCA, stop-loss/take-profit,
    and rebalancing. Most actions follow a two-step flow: compute EIP-712
    data to sign via `POST /{action}/prepare`, then submit the signature via
    `POST /{action}` to execute it.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.0.1-rc
externalDocs:
  description: Find out more about Mimic
  url: https://mimic.fi
tags:
  - name: General
    description: Query the chains and settler addresses supported by the API
  - name: Tokens
    description: Query the tokens supported by the API and their prices
  - name: Wallets management
    description: >-
      Create and manage wallets. For Safe wallets, compute EIP-712 data to
      sign via `POST /wallets/safe/prepare`, then submit the signature via
      `POST /wallets/safe`. For custodial EOA wallets, create directly via
      `POST /wallets/eoa`
  - name: Transfers
    description: >-
      Send tokens to a recipient. Compute EIP-712 data to sign via
      `POST /transfers/prepare`, then submit the signature via `POST /transfers`
  - name: Contract calls
    description: >-
      Execute arbitrary contract calls from a wallet. Compute EIP-712 data
      to sign via `POST /calls/prepare`, then submit the signature via
      `POST /calls`. EOAs are not supported (unless they use proper EIP-7702 delegation)
  - name: Swap
    description: >-
      Single-chain and recurring swap-based actions. Compute EIP-712 data
      to sign via `POST /{action}/prepare`, then submit the signature via
      `POST /{action}`
  - name: Bridge
    description: >-
      Cross-chain token transfers. Compute EIP-712 data to sign via
      `POST /bridges/prepare`, then submit the signature via `POST /bridges`
  - name: Earn
    description: >-
      Lending, staking and yield strategies. Compute EIP-712 data
      to sign via `POST /{action}/prepare`, then submit the signature via
      `POST /{action}`
  - name: Assets management
    description: >-
      Automated strategies that manage a portfolio over time. Compute
      EIP-712 data to sign via `POST /{action}/prepare`, then submit the
      signature via `POST /{action}`
paths:
  /chains:
    get:
      tags:
        - General
      description: Get supported chains
      responses:
        '200':
          description: List of supported chains
          content:
            application/json:
              schema:
                type: object
                required:
                  - chains
                properties:
                  chains:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          allOf:
                            - $ref: '#/components/schemas/Chain'
                          description: >-
                            Identifier used to reference this chain
                            everywhere else in the API
                        name:
                          type: string
                          description: Human-readable chain name
                          example: Ethereum
  /settlers:
    get:
      tags:
        - General
      description: >-
        Get Mimic's smart contract address for each supported chain. This
        is the address a user's wallet must allow to move its funds when
        executing an action.
      responses:
        '200':
          description: List of settler addresses for all supported chains
          content:
            application/json:
              schema:
                type: object
                required:
                  - settlers
                properties:
                  settlers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Settler'
        '400':
          $ref: '#/components/responses/BadRequest'
  /settlers/{chain}:
    get:
      tags:
        - General
      description: >-
        Get Mimic's smart contract address for a supported chain. This is
        the address a user's wallet must allow to move its funds when
        executing an action.
      parameters:
        - name: chain
          in: path
          required: true
          description: Chain for which to get the settler address
          schema:
            $ref: '#/components/schemas/Chain'
      responses:
        '200':
          description: Settler address for the requested chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settler'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /tokens:
    get:
      tags:
        - Tokens
      description: >-
        Returns the tokens supported by the API, optionally filtered by
        chain.
      parameters:
        - name: chains
          in: query
          required: false
          description: >-
            Only return tokens on these chains, as a comma-separated
            list. Omit to return tokens on every supported chain.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Chain'
          example: 'ethereum,base'
      responses:
        '200':
          description: List of supported tokens
          content:
            application/json:
              schema:
                type: object
                required:
                  - tokens
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
  /tokens/{address}:
    get:
      tags:
        - Tokens
      description: >-
        Returns information about a specific supported token, including
        its current USD price.
      parameters:
        - name: address
          in: path
          required: true
          description: Token contract address
          schema:
            $ref: '#/components/schemas/Address'
        - name: chain
          in: query
          required: true
          description: >-
            Chain the token is on
          schema:
            $ref: '#/components/schemas/Chain'
      responses:
        '200':
          description: The requested token, including its current USD price
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Token'
                  - type: object
                    required:
                      - price
                    properties:
                      price:
                        type: number
                        description: Current token price in USD
                        example: 1.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/eoa:
    post:
      tags:
        - Wallets management
      description: >-
        Create a new custodial EOA wallet, generating and storing a new
        keypair managed by Mimic
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: >-
                    Chain for which to create the wallet
      responses:
        '200':
          description: The newly created EOA wallet
          content:
            application/json:
              schema:
                type: object
                required:
                  - chain
                  - address
                properties:
                  chain:
                    allOf:
                      - $ref: '#/components/schemas/Chain'
                    description: Chain this wallet was created for
                  address:
                    allOf:
                      - $ref: '#/components/schemas/Address'
                    description: >-
                      Address of the created EOA wallet, in the format
                      used by the requested chain
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Wallets management
      description: >-
        List the custodial EOA wallets created under the caller's account,
        optionally filtered by chain and/or address
      security:
        - ApiKeyAuth: []
      parameters:
        - name: chain
          in: query
          required: false
          description: Only return wallets created for this chain
          schema:
            $ref: '#/components/schemas/Chain'
        - name: address
          in: query
          required: false
          description: >-
            Only return wallets matching this address, if they belong to
            the caller's account
          schema:
            $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: List of EOA wallets
          content:
            application/json:
              schema:
                type: object
                required:
                  - wallets
                properties:
                  wallets:
                    type: array
                    items:
                      type: object
                      required:
                        - address
                        - chain
                      properties:
                        chain:
                          allOf:
                            - $ref: '#/components/schemas/Chain'
                          description: Chain this wallet was created for
                        address:
                          allOf:
                            - $ref: '#/components/schemas/Address'
                          description: >-
                            Address of the EOA wallet, in the format used by
                            chain
        '401':
          $ref: '#/components/responses/Unauthorized'
  /wallets/safe:
    post:
      tags:
        - Wallets management
      description: >-
        Submit the signature of the data obtained from
        `POST /wallets/safe/prepare` to create the Safe wallet. Track the
        execution via `GET /wallets/safe/{id}`.
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmission'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/safe/prepare:
    post:
      tags:
        - Wallets management
      description: >-
        Computes EIP-712 data to be signed to create a new Safe wallet.
        Submit the resulting signature via `POST /wallets/safe`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - owner
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain for which to create the wallet
                owner:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address that will own the Safe wallet
                expectedAddress:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Use this option to create a wallet with the same address
                    as one previously deployed on another chain. If the
                    wallet already exists for the specified `owner` and
                    `chain`, wallet creation is skipped.
      responses:
        '200':
          description: EIP-712 data to be signed to create a new Safe wallet
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                properties:
                  signaturePayload:
                    $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
  /wallets/safe/{id}:
    get:
      tags:
        - Wallets management
      description: Get the status of a Safe wallet creation execution
      parameters:
        - name: id
          in: path
          required: true
          description: ID returned by POST /wallets/safe
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Status of the wallet creation execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
                      walletAddress:
                        allOf:
                          - $ref: '#/components/schemas/Address'
                        description: >-
                          Address of the created wallet. Present only when
                          status is `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/{wallet}/balances:
    get:
      tags:
        - Wallets management
      description: Get the current balance of a specific token held by a wallet, on a specific chain.
      parameters:
        - name: wallet
          in: path
          required: true
          description: Wallet address to query
          schema:
            $ref: '#/components/schemas/Address'
        - name: chain
          in: query
          required: true
          description: Chain to read the balance on
          schema:
            $ref: '#/components/schemas/Chain'
        - name: token
          in: query
          required: true
          description: >-
            Token contract address. Use
            `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
          schema:
            $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: Token balance
          content:
            application/json:
              schema:
                type: object
                required:
                  - amount
                properties:
                  amount:
                    type: string
                    description: Token balance, as a decimal string
                    example: '10.5'
        '400':
          $ref: '#/components/responses/BadRequest'
  /transfers:
    post:
      tags:
        - Transfers
      description: >-
        Submit the signature of the data obtained from
        `POST /transfers/prepare`, along with any required approvals, to
        transfer tokens from a wallet to a recipient. Track the execution
        via
        `GET /transfers/{id}`.
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /transfers/prepare:
    post:
      tags:
        - Transfers
      description: >-
        Computes EIP-712 data to be signed to transfer tokens from a wallet
        to a recipient. Submit the resulting signature, along with a
        signature for each entry in `requiredApprovals` if any are
        returned, via `POST /transfers`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - token
                - amount
                - wallet
                - recipient
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain where the transfer will be executed
                token:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to transfer. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                amount:
                  type: string
                  description: Amount of token to transfer, as a decimal string
                  example: '10.5'
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address from where the funds will be pulled
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address that receives the tokens
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: EIP-712 data to be signed to create the transfer
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                  - requiredApprovals
                properties:
                  signaturePayload:
                    allOf:
                      - $ref: '#/components/schemas/TriggerSignaturePayload'
                    description: EIP-712 data to be signed to create the transfer
                  requiredApprovals:
                    type: array
                    description: >-
                      Raw `approve()` transactions that must be signed and
                      submitted alongside the action signature. Empty when
                      no approvals are required.
                    items:
                      $ref: '#/components/schemas/TransactionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
  /transfers/{id}:
    get:
      tags:
        - Transfers
      description: Get the status of a transfer execution
      parameters:
        - name: id
          in: path
          required: true
          description: ID returned by POST /transfers
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Status of the transfer execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /calls:
    post:
      tags:
        - Contract calls
      description: >-
        Submit the signature of the data obtained from `POST /calls/prepare`
        to execute one or more arbitrary contract calls from a wallet,
        atomically. Track the execution via `GET /calls/{id}`.
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmission'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /calls/prepare:
    post:
      tags:
        - Contract calls
      description: >-
        Computes EIP-712 data to be signed to execute one or more arbitrary
        contract calls from a wallet, atomically. Submit the resulting
        signature via `POST /calls`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - wallet
                - calls
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain where the calls will be executed
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that executes the calls. EOAs are not
                    supported (unless they use proper EIP-7702 delegation).
                description:
                  type: string
                  description: >-
                    Human-readable label describing what the calls do
                  example: 'Approve USDC'
                calls:
                  type: array
                  description: >-
                    Calls to execute, in order and atomically. If any
                    call reverts, the whole batch reverts.
                  minItems: 1
                  items:
                    type: object
                    required:
                      - to
                      - data
                    properties:
                      to:
                        allOf:
                          - $ref: '#/components/schemas/Address'
                        description: Target contract address to call
                      data:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: ABI-encoded calldata for the call
                      value:
                        allOf:
                          - $ref: '#/components/schemas/BigInteger'
                        description: >-
                          Native token value to send with this call, in
                          wei. Defaults to '0'.
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: EIP-712 data to be signed to execute the calls
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                properties:
                  signaturePayload:
                    $ref: '#/components/schemas/TriggerSignaturePayload'
        '400':
          $ref: '#/components/responses/BadRequest'
  /calls/{id}:
    get:
      tags:
        - Contract calls
      description: Get the status of contract calls execution
      parameters:
        - name: id
          in: path
          required: true
          description: ID returned by POST /calls
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Status of the call execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
                      returnData:
                        type: array
                        description: >-
                          Raw return data from each call, in the same order
                          as the request's `calls`. Present only when
                          status is `succeeded`.
                        items:
                          $ref: '#/components/schemas/HexString'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /swaps:
    post:
      tags:
        - Swap
      description: >-
        Submit the signature of the data obtained from `POST /swaps/prepare`,
        along with any required approvals, to execute the single-chain
        swap. Track the
        execution via `GET /swaps/{id}`.
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /swaps/prepare:
    post:
      tags:
        - Swap
      description: >-
        Computes EIP-712 data to be signed to create a single-chain swap
        operation. Submit the resulting signature, along with a signature
        for each entry in `requiredApprovals` if any are returned, via
        `POST /swaps`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - tokenIn
                - amount
                - tokenOut
                - wallet
                - slippageBps
              properties:
                chain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain where the swap will be executed
                tokenIn:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to swap from. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                amount:
                  type: string
                  description: Amount of tokenIn to swap, as a decimal string
                  example: '0.05'
                tokenOut:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Token to swap to. Use `0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE` for native token.
                wallet:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: Address from where the funds will be pulled
                slippageBps:
                  type: integer
                  description: >-
                    Maximum slippage in tokenOut amount to accept, in basis
                    points (e.g. 10000 = 100%)
                  minimum: 0
                  maximum: 10000
                  example: 50
                recipient:
                  allOf:
                    - $ref: '#/components/schemas/Address'
                  description: >-
                    Address that receives the tokenOut. Defaults to `wallet`.
                feeAmount:
                  type: string
                  description: >-
                    Max fee in USD. Defaults to 0.
                  example: '1.5'
      responses:
        '200':
          description: EIP-712 data to be signed to create the swap intent
          content:
            application/json:
              schema:
                type: object
                required:
                  - signaturePayload
                  - requiredApprovals
                properties:
                  signaturePayload:
                    allOf:
                      - $ref: '#/components/schemas/TriggerSignaturePayload'
                    description: EIP-712 data to be signed to create the swap intent
                  requiredApprovals:
                    type: array
                    description: >-
                      Raw `approve()` transactions that must be signed and
                      submitted alongside the action signature. Empty when
                      no approvals are required.
                    items:
                      $ref: '#/components/schemas/TransactionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
  /swaps/{id}:
    get:
      tags:
        - Swap
      description: Get the status of a swap execution
      parameters:
        - name: id
          in: path
          required: true
          description: ID returned by POST /swaps
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Status of the swap execution
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ExecutionStatus'
                  - type: object
                    properties:
                      txHash:
                        allOf:
                          - $ref: '#/components/schemas/HexString'
                        description: >-
                          Transaction hash. Present only when status is
                          `succeeded`.
                      amountOut:
                        type: string
                        description: >-
                          Actual amount of tokenOut received. Present only
                          when status is `succeeded`.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /bridges:
    post:
      tags:
        - Bridge
      description: >-
        Submit the signature of the data obtained from `POST /bridges/prepare`,
        along with any required approvals, to move a token from one chain
        to another. Track the execution via `GET /bridges/{id}`.
      requestBody:
        $ref: '#/components/requestBodies/SignatureSubmissionWithApprovals'
      responses:
        '200':
          $ref: '#/components/responses/SignatureSubmitted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /bridges/prepare:
    post:
      tags:
        - Bridge
      description: >-
        Computes EIP-712 data to be signed to move a token from one chain to
        another. Submit the resulting signature, along with a signature
        for each entry in `requiredApprovals` if any are returned, via
        `POST /bridges`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sourceChain
                - destinationChain
                - token
                - amount
                - wallet
                - slippageBps
              properties:
                sourceChain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain to bridge the token from
                destinationChain:
                  allOf:
                    - $ref: '#/components/schemas/Chain'
                  description: Chain to receive the token on
                token:
                  allOf:
                    - $ref: '#/components/schemas/Address'
